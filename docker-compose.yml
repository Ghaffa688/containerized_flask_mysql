services:
  db:
    build:
      context: ./mysql
      dockerfile: mysql.dockerfile
    container_name: flask_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_PASSWORD_FILE:      /run/secrets/mysql_password
      MYSQL_USER_FILE:          /run/secrets/mysql_user
      MYSQL_DATABASE_FILE:      /run/secrets/mysql_database
    secrets:
      - mysql_root_password
      - mysql_password
      - mysql_user
      - mysql_database
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$(cat /run/secrets/mysql_root_password)"]
      interval: 5s
      timeout: 5s
      retries: 15

  web:
    build:
      context: ./app
      dockerfile: app.dockerfile
    container_name: flask_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      MYSQL_HOST: db
      MYSQL_USER_FILE:     /run/secrets/mysql_user
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_DB_FILE:       /run/secrets/mysql_database
    secrets:
      - mysql_user
      - mysql_password
      - mysql_database
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer:latest
    container_name: flask_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
  mysql_password:
    file: ./secrets/mysql_password.txt
  mysql_user:
    file: ./secrets/mysql_user.txt
  mysql_database:
    file: ./secrets/mysql_database.txt

volumes:
  db_data: